name: commit-msg

on: [push, pull_request]

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate commits with commitlint
        shell: bash
        # Run from /tmp to avoid npx resolving to the local package.json.
        # Since this repo IS conventional-commit-msg, npx would try to run
        # the local (unbuilt) package instead of downloading from npm.
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            (cd /tmp && npx -y conventional-commit-msg --verbose --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}")
          else
            (cd /tmp && npx -y conventional-commit-msg --verbose --last)
          fi
